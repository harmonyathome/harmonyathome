<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Harmony@Home | Private Child Care</title>
  <link rel="stylesheet" type="text/css" href="css/vendor/bootstrap.min.css" />
  <link rel="stylesheet" type="text/css" href="css/style.css" />
  <link rel="icon" href="images/newfavicon.png" type="image/png">
</head>
<body>
  <div class="container" style="max-width: 700px; margin: 60px auto; padding: 40px; background: #f8f9ff; border-radius: 20px; box-shadow: 0 8px 25px rgba(122, 165, 253, 0.1);">
    <div style="text-align: center; margin-bottom: 32px;">
      <img src="images/NEW H@H LOGO 3 (900 x 500 px).png" alt="Harmony@Home Logo" style="max-width: 50%; height: auto; margin: 0 auto;">
    </div>
    <h1 style="color: #c5606b; font-size: 2rem; font-weight: 700; text-align: center; margin-bottom: 24px;">Book Ajonay For Care</h1>
    <p style="color: #222; font-size: 1.1rem; text-align: center; margin-bottom: 32px;">Congratulations on becoming a VIP Family of Harmony@Home! You can now book Ajonay directly for your care needs! Please make sure your request matches your form and do not share this link with anyone.</p>
    <form>
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" class="form-control" id="phone">
      </div>
      <div class="form-group">
        <label for="service">Service Type</label>
        <select class="form-control" id="service" required>
          <option value="">Select a service</option>
          <option value="Placements">Placements</option>
          <option value="On-Call Care">On-Call Care</option>
          <option value="Travel Support">Travel Support</option>
        </select>
      </div>
      <div class="form-group">
        <label for="details">Additional Details</label>
        <textarea class="form-control" id="details" rows="4" placeholder="Tell us about your family, dates needed, or any special requests..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="background: linear-gradient(135deg, #c5606b 0%, #e0828c 100%); border: none; border-radius: 20px; font-weight: 600; padding: 10px 32px; margin-top: 18px;">Submit Booking</button>
    </form>
  </div>
</body>
</html>
